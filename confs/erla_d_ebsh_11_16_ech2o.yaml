# Mapping for ERLA D EBSH-X 16P30-50 D series 11-16kW-ECH2O systems.
# Cross-checked with the upstream ESPAltherma model definition:
# https://github.com/raomin/ESPAltherma/blob/main/include/def/Altherma(ERLA%20D%20EBSH-X%2016P30-50%20D%20SERIES%2011-16kW-ECH2O).h
#
# NOTE on byte order: The EBSH ECH2O unit sends 16-bit temperature values in
# big-endian order (high byte first). All 2-byte temperature sensors therefore
# use convid 106 (big-endian signed int16 × 0.1 = °C).
# This is confirmed by live data: raw bytes [0x01, 0xC9] at offsets 2 and 8
# decode to 45.7 °C with conv106, which is physically plausible (equalized water
# circuit), while conv105 (little-endian) decodes those same bytes to −1407.9 °C.
# The upstream definition file uses conv105, but that appears to be based on a
# different hardware variant.

# anchors
.altherma_base: &altherma_base
  platform: altherma_hub
  altherma_hub_id: altherma_hub_1

.temp: &temp
  <<: *altherma_base
  device_class: temperature
  unit_of_measurement: °C
  state_class: measurement
  accuracy_decimals: 1

.binary: &binary
  <<: *altherma_base

.pressure: &pressure
  <<: *altherma_base
  device_class: pressure
  unit_of_measurement: bar
  state_class: measurement
  accuracy_decimals: 1

.text: &text
  <<: *altherma_base

sensor:
  - <<: *temp
    name: Outdoor air temp.
    register: 0x20
    offset: 0
    convid: 106
    datasize: 2
  - <<: *temp
    name: Leaving water temp. before BUH (R1T)
    register: 0x61
    offset: 2
    convid: 106
    datasize: 2
  - <<: *temp
    name: Outlet Water BUH Temp. (R2T)
    register: 0x61
    offset: 4
    convid: 106
    datasize: 2
  - <<: *temp
    name: Refrig. Temp. liquid side (R3T)
    register: 0x61
    offset: 6
    convid: 106
    datasize: 2
  - <<: *temp
    name: Inlet water temp.(R4T)
    register: 0x61
    offset: 8
    convid: 106
    datasize: 2
  - <<: *temp
    # convid 108: big-endian signed int16 × 0.1, with sentinel check.
    # R5T is not wired in the ECH2O hydrobox, so the protocol sends [0x00, 0x80]
    # (big-endian representation of the "not connected" sentinel).
    # conv108 detects this and returns "---" instead of 12.8 °C.
    name: DHW tank temp. (R5T)
    register: 0x61
    offset: 10
    convid: 108
    datasize: 2
  - <<: *altherma_base
    name: Flow sensor (l⁄min)
    register: 0x62
    offset: 9
    convid: 105
    datasize: 2
    unit_of_measurement: l/min
    state_class: measurement
    accuracy_decimals: 1
  - <<: *pressure
    name: Water pressure
    register: 0x62
    offset: 11
    convid: 105
    datasize: 1

binary_sensor:
  - <<: *binary
    name: Defrost Operation
    register: 0x10
    offset: 1
    convid: 304
    datasize: 1

text_sensor:
  - <<: *text
    name: Operation Mode
    icon: mdi:heat-pump
    register: 0x10
    offset: 0
    convid: 217
    datasize: 1
  - <<: *text
    name: I⁄U operation mode
    icon: mdi:heat-pump
    register: 0x60
    offset: 2
    convid: 315
    datasize: 1
